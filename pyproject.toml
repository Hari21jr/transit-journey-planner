[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transitrouter"
version = "1.0.0"
description = "Transit journey planner using the RAPTOR algorithm over GTFS feeds"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hari Jeyaseelan", email = "jhari2020@gmail.com" }]
keywords = ["gtfs", "transit", "routing", "raptor", "shortest-path"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# No runtime dependencies. The router is stdlib only, which keeps it
# installable anywhere and makes the algorithm the whole of the project.
dependencies = []

[project.optional-dependencies]
# The web planner is the one thing that needs a third-party package, so it
# is an extra rather than a dependency: `pip install transitrouter` still
# pulls in nothing at all.
web = ["Flask>=3.0,<4"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "Flask>=3.0,<4"]

[project.scripts]
journey = "transitrouter.cli:main"

[project.urls]
Repository = "https://github.com/Hari21jr/transit-journey-planner"

[tool.setuptools.packages.find]
include = ["transitrouter*"]

# The HTML template is not a .py file, so it is not installed unless it is
# named here. An installed copy would render a blank page without it.
[tool.setuptools.package-data]
transitrouter = ["web/templates/*.html"]
